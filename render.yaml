databases:
  - name: teachka-db-eu
    plan: basic-256mb
    region: frankfurt
    databaseName: teachkadbeu
    user: teachkadbeu_user

services:
  - type: keyvalue
    name: teachka-redis-eu
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    plan: starter
    name: teachka-web-eu
    region: frankfurt
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn teachkaBaseProject.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teachka-db-eu
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: teachka-redis-eu
          property: connectionString
