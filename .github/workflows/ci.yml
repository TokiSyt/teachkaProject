name: CI

on:
  pull_request:
    branches: [main, development]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.9.2

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mypy
        run: mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov --cov-fail-under=70
        env:
          SECRET_KEY: ci-test-secret-key

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        # GHSA-6w46-j5rx-g56g (CVE-2025-71176): pytest 8 dev-tool CVE; bump to 9
        # blocked by apps.calendar shadowing stdlib calendar under pytest 9 collection.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-6w46-j5rx-g56g

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django deployment checklist
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: teachkaBaseProject.settings
          DEBUG: "false"
          SECRET_KEY: "ci-deploy-check-not-for-production-use-50chars-minimum-xxxxx"
          DATABASE_URL: "sqlite:////tmp/teachka_deploy_check.sqlite3"
