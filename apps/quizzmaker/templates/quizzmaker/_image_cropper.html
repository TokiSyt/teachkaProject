{% load i18n %}
{% comment %} Crop preview for an image field (static/js/image_cropper.js drives the dims and preview). {% endcomment %}
<div class="image-cropper ap-cropper hidden" data-image-cropper data-input-id="{{ input_id }}">
  <div>
    <p class="ap-field-label mb-2">{% trans "Original" %} · {% trans "shaded = cut" %}</p>
    <div data-crop-stage class="ap-crop-stage">
      <img data-crop-full alt="">
      <div data-crop-dim="top"    class="crop-dim ap-crop-dim is-top"></div>
      <div data-crop-dim="bottom" class="crop-dim ap-crop-dim is-bottom"></div>
      <div data-crop-dim="left"   class="crop-dim ap-crop-dim is-left"></div>
      <div data-crop-dim="right"  class="crop-dim ap-crop-dim is-right"></div>
    </div>
    <p class="ap-help mt-1">{% trans "Drag the bright area to choose what is kept" %}</p>
  </div>
  <div>
    <p class="ap-field-label mb-2">{% trans "Card preview" %}</p>
    <div class="ap-crop-card"><img data-crop-card alt=""></div>
  </div>
</div>
